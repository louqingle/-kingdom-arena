<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101b2b">
<title>王者战域 · 5V5</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101b2b;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;touch-action:none;color:#fff}#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}#hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:env(safe-area-inset-top,8px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:8px 18px;background:#0a1424c9;border:1px solid #ffffff24;border-radius:0 0 18px 18px;backdrop-filter:blur(12px);font-size:12px;white-space:nowrap}.score{font-size:19px;font-weight:900;color:#ffe08a}.timer{font-variant-numeric:tabular-nums;color:#dceaff}.team{font-weight:800}.blue{color:#63b7ff}.red{color:#ff7979}.hint{position:absolute;top:66px;left:50%;transform:translateX(-50%);font-size:11px;color:#d7e5f8;background:#071323a8;padding:6px 12px;border-radius:20px;white-space:nowrap}.panel{position:absolute;left:12px;top:72px;background:#091729b8;border:1px solid #ffffff22;border-radius:12px;padding:8px 10px;font-size:10px;line-height:1.7;color:#cbd9ec}.panel b{color:#fff}.bottom{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));left:0;right:0;height:145px}.joystick{position:absolute;left:20px;bottom:4px;width:112px;height:112px;border-radius:50%;background:#b6d7ff20;border:2px solid #d6e9ff55;pointer-events:auto;touch-action:none;box-shadow:inset 0 0 24px #9bcaff18}.stick{position:absolute;left:50%;top:50%;width:46px;height:46px;transform:translate(-50%,-50%);border-radius:50%;background:linear-gradient(145deg,#e9f6ff,#6fa8dc);box-shadow:0 4px 18px #0008}.actions{position:absolute;right:18px;bottom:0;display:flex;align-items:flex-end;gap:10px;pointer-events:auto}.act{width:58px;height:58px;border-radius:50%;border:2px solid #ffffff9c;background:linear-gradient(145deg,#284d75,#10263f);color:white;font-size:11px;font-weight:800;box-shadow:0 5px 15px #0008;touch-action: manipulation}.act.big{width:72px;height:72px;background:linear-gradient(145deg,#f2b85b,#9b4d22);font-size:13px}.act:active{transform:scale(.94);filter:brightness(1.3)}.act small{display:block;font-size:9px;font-weight:500;opacity:.8}.bars{position:absolute;left:50%;bottom:156px;transform:translateX(-50%);width:180px;text-align:center;font-size:10px;text-shadow:0 1px 3px #000}.bar{height:6px;border-radius:8px;background:#28394d;margin:3px 0 5px;overflow:hidden}.hp{height:100%;width:100%;background:linear-gradient(90deg,#4ee28a,#a4f36a)}.mp{height:100%;width:100%;background:#53baff}.overlay{position:absolute;inset:0;z-index:20;background:#071323d9;display:flex;align-items:center;justify-content:center;pointer-events:auto;padding:24px}.card{width:min(420px,100%);background:linear-gradient(150deg,#1b3452,#0b1728);border:1px solid #ffffff2b;border-radius:24px;padding:26px;box-shadow:0 20px 70px #0009;text-align:center}.logo{font-size:12px;letter-spacing:5px;color:#8bbbe8}.card h1{font-size:32px;margin:8px 0}.card p{font-size:13px;line-height:1.8;color:#c3d4e8}.start{position:relative;z-index:100;display:inline-block;min-width:190px;min-height:56px;cursor:pointer;user-select:none;-webkit-user-select:none;z-index:30;pointer-events:auto;touch-action:manipulation;-webkit-appearance:none;appearance:none;border:0;border-radius:14px;padding:14px 34px;background:linear-gradient(90deg,#f5c66e,#e78d45);font-weight:900;font-size:16px;color:#172033;margin-top:12px}.tip{font-size:10px!important;color:#8fa7c2!important}.result{font-size:26px;font-weight:900;margin:12px}.hidden{display:none!important}@media(orientation:portrait){.rotate{display:block!important}}.rotate{display:none;position:absolute;inset:0;background:#081525eF;z-index:10;text-align:center;padding-top:40vh;font-size:18px;font-weight:800}
</style>
</head>
<body><div id="game"></div><div id="hud">
<div class="top"><span class="team blue">蓝方</span><span class="score" id="score">0 : 0</span><span class="team red">红方</span><span class="timer" id="timer">00:00</span></div>
<div class="hint" id="hint">摧毁敌方水晶，守护己方基地</div>
<div class="panel"><b>王者战域 · 训练赛</b><br>击败：<span id="kills">0</span>　金币：<span id="gold">300</span><br>目标：摧毁红方水晶</div>
<div class="bars"><span id="heroName">破阵战士 · Lv.1</span><div class="bar"><div class="hp" id="hp"></div></div><div class="bar"><div class="mp" id="mana"></div></div></div>
<div class="bottom"><div class="joystick" id="joy"><div class="stick" id="stick"></div></div><div class="actions"><button class="act" id="skill2">位移<small>技能2</small></button><button class="act" id="skill1">旋风<small>技能1</small></button><button class="act" id="recall">回城<small>3秒</small></button><button class="act big" id="attack">普攻<small>自动锁敌</small></button></div></div>
<div class="overlay" id="intro"><div class="card"><div class="logo">KINGDOM ARENA</div><h1>王者战域</h1><p>5V5 单人对战 · 3D 斜俯视<br>操控蓝方战士，和队友一起推进三路，击破敌方防御塔与水晶。</p><p class="tip">建议横屏游玩 · 左侧摇杆移动 · 右侧按钮攻击和释放技能</p><button type="button" class="start" id="start" onclick="window.__gameStarted=true;document.getElementById('intro').style.display='none';" ontouchend="window.__gameStarted=true;document.getElementById('intro').style.display='none';">进入战场</button></div></div>
<div class="overlay hidden" id="end"><div class="card"><div class="logo">MATCH OVER</div><div class="result" id="result">胜利</div><p id="endText">战斗结束</p><button class="start" id="again">再来一局</button></div></div>
<div class="rotate" id="rotate">请将手机横过来<br><small>横屏体验更佳</small></div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const root=document.querySelector('#game');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bbbd0);scene.fog=new THREE.Fog(0x9bbbd0,42,105);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,180);camera.position.set(0,24,27);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd9edff,0x52634e,2.1));const sun=new THREE.DirectionalLight(0xfff1d4,2.4);sun.position.set(-14,28,12);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-38;sun.shadow.camera.right=38;sun.shadow.camera.top=38;sun.shadow.camera.bottom=-38;scene.add(sun);
const mat=(c,r=.8,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const grass=mat(0x527b55),path=mat(0xb3a27d),edge=mat(0x344d42),blue=mat(0x398fe0,.5,.25),red=mat(0xd95054,.5,.2),gold=mat(0xf3c56b,.35,.5),dark=mat(0x26394a),stone=mat(0x667b88),leaf=mat(0x2c6648),white=mat(0xeaf4ff);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(100,100),grass);floor.rotation.x=-Math.PI/2;floor.position.y=-.25;floor.receiveShadow=true;scene.add(floor);
function box(x,y,z,sx,sy,sz,material){const o=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),material);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
function sphere(x,y,z,r,material){const o=new THREE.Mesh(new THREE.SphereGeometry(r,14,12),material);o.position.set(x,y,z);o.castShadow=true;scene.add(o);return o}
function lane(points){const curve=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(p[0],.01,p[1])));const pts=curve.getPoints(80);const geo=new THREE.BufferGeometry().setFromPoints(pts);const mesh=new THREE.Mesh(new THREE.TubeGeometry(curve,80,1.45,8,false),path);mesh.position.y=0;scene.add(mesh);const stripe=new THREE.Mesh(new THREE.TubeGeometry(curve,80,.045,5,false),gold);stripe.position.y=.06;scene.add(stripe)}
lane([[-30,-18],[-18,-18],[-8,-14],[0,-10],[10,-8],[20,-8],[30,-8]]);
lane([[-30,0],[-18,0],[-8,0],[0,0],[10,0],[20,0],[30,0]]);
lane([[-30,18],[-18,18],[-8,14],[0,10],[10,8],[20,8],[30,8]]);
// jungle scenery
for(let i=0;i<70;i++){let x=(Math.random()-.5)*68,z=(Math.random()-.5)*54;if(Math.abs(z)<4||Math.abs(z-8)<3||Math.abs(z+8)<3||Math.abs(x)<7)continue;const trunk=box(x,.6,z,.35,1.2,.35,mat(0x73583b));const crown=sphere(x,1.8,z,.95,leaf);crown.scale.set(1,1.1,1)}
// base platforms and crystal
function crystal(x,z,color){const c=new THREE.Group();const core=new THREE.Mesh(new THREE.OctahedronGeometry(1.35,1),new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:.35,metalness:.55,roughness:.2}));core.position.y=2.1;core.castShadow=true;c.add(core);const ring=new THREE.Mesh(new THREE.TorusGeometry(1.9,.13,8,32),gold);ring.rotation.x=Math.PI/2;ring.position.y=.18;c.add(ring);c.position.set(x,0,z);scene.add(c);return c}
box(-31,.2,0,7,.5,11,stone);box(31,.2,0,7,.5,11,stone);const blueBase=crystal(-31,0,0x42aaff),redBase=crystal(31,0,0xff5c61);
function tower(x,z,team){const g=new THREE.Group();const color=team==='blue'?blue:red;const base=new THREE.Mesh(new THREE.CylinderGeometry(1.25,1.55,.8,8),stone);base.position.y=.4;g.add(base);const body=new THREE.Mesh(new THREE.CylinderGeometry(.75,.95,2.2,8),color);body.position.y=1.8;body.castShadow=true;g.add(body);const cap=new THREE.Mesh(new THREE.ConeGeometry(.85,1.15,8),gold);cap.position.y=3.45;g.add(cap);const orb=sphere(0,3.1,0,.32,white);g.add(orb);g.position.set(x,0,z);scene.add(g);return {group:g,team,hp:1000,max:1000,range:8,cool:0}}
const towers=[];for(const z of [-18,0,18]){towers.push(tower(-19,z,'blue'),tower(19,z,'red'))}
function makeHero(team,role,x,z,isPlayer=false){const g=new THREE.Group();const c=team==='blue'?blue:red;const body=new THREE.Mesh(new THREE.CapsuleGeometry(.55,.85,4,8),c);body.position.y=1.05;body.castShadow=true;g.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.42,16,12),mat(0xf0c49b));head.position.y=1.95;g.add(head);const helm=new THREE.Mesh(new THREE.ConeGeometry(.48,.7,6),gold);helm.position.y=2.42;g.add(helm);const weapon=new THREE.Mesh(new THREE.BoxGeometry(.13,1.4,.16),gold);weapon.position.set(.62,1.12,0);weapon.rotation.z=-.2;weapon.castShadow=true;g.add(weapon);const ring=new THREE.Mesh(new THREE.TorusGeometry(.75,.06,6,24),isPlayer?gold:c);ring.rotation.x=Math.PI/2;ring.position.y=.12;g.add(ring);g.position.set(x,0,z);scene.add(g);return {g,team,role,hp: isPlayer?1400:850,max:isPlayer?1400:850,atk:isPlayer?115:65,speed:isPlayer?7:3.2,range:isPlayer?5:3.8,cool:0,alive:true,respawn:0,isPlayer,target:null,baseX:x,baseZ:z}}
const heroes=[];const player=makeHero('blue','战士',-24,2,true);heroes.push(player);
const roles=['坦克','法师','射手','打野'];for(let i=0;i<4;i++){heroes.push(makeHero('blue',roles[i],-26,[-5,-1,5,9][i]));heroes.push(makeHero('red',roles[i],25,[-9,-3,3,9][i]))}
heroes.push(makeHero('red','战士',24,0));
const minions=[];function spawnMinions(){for(const team of ['blue','red'])for(const z of [-16,0,16]){const m=makeHero(team,'兵线',team==='blue'?-28:28,z);m.hp=m.max=220;m.atk=22;m.speed=2.1;m.range=2.7;m.isMinion=true;minions.push(m)}}spawnMinions();
let started=false,ended=false,elapsed=0,kills=0,gold=300,mana=100,skill1=0,skill2=0,recall=0,joy={x:0,y:0},attackHeld=false;
const $=s=>document.querySelector(s);function updateHud(){$('#hp').style.width=Math.max(0,player.hp/player.max*100)+'%';$('#mana').style.width=mana+'%';$('#kills').textContent=kills;$('#gold').textContent=gold;$('#timer').textContent=String(Math.floor(elapsed/60)).padStart(2,'0')+':'+String(Math.floor(elapsed%60)).padStart(2,'0')}
function closestEnemy(unit,range=Infinity){let best=null,d=range;for(const e of [...heroes,...minions])if(e.team!==unit.team&&e.alive){const dist=e.g.position.distanceTo(unit.g.position);if(dist<d){d=dist;best=e}}return best}
function damage(target,amount){if(!target||!target.alive)return;target.hp-=amount;if(target.hp<=0){target.alive=false;target.g.visible=false;if(target.team==='red'&&target.isMinion){gold+=35;if(target!==player){} }if(target.team==='red'&&!target.isMinion){gold+=100;if(target.isPlayer===false){} }if(target===player){setTimeout(()=>{if(!ended){player.hp=player.max;player.g.position.set(-25,0,0);player.g.visible=true;player.alive=true}},3500)}else if(target.team==='red'&&target.isPlayer===false)kills++}}
let redCrystalHp=2400;
function attack(unit){
 if(!unit.alive||unit.cool>0)return;
 const e=closestEnemy(unit,unit.range+1.5);
 unit.cool=unit.isPlayer?.48:1.15;
 if(e){damage(e,unit.atk);if(unit.isPlayer)mana=Math.max(0,mana-1);return}
 if(unit.isPlayer){
  const target=towers.filter(t=>t.team==='red'&&t.hp>0).sort((a,b)=>unit.g.position.distanceTo(a.group.position)-unit.g.position.distanceTo(b.group.position))[0];
  if(target&&unit.g.position.distanceTo(target.group.position)<unit.range+2){const before=target.hp;target.hp=Math.max(0,target.hp-unit.atk);target.group.scale.y=Math.max(.12,target.hp/target.max);if(before>0&&target.hp===0)gold+=100;$('#hint').textContent='正在攻击敌方防御塔';return}
  if(towers.filter(t=>t.team==='red'&&t.hp>0).length===0&&unit.g.position.distanceTo(redBase.position)<unit.range+3){redCrystalHp=Math.max(0,redCrystalHp-unit.atk);$('#hint').textContent='敌方水晶耐久 '+Math.ceil(redCrystalHp/24)+'%';if(redCrystalHp===0)setEnd(true)}
  mana=Math.max(0,mana-1);
 }
}
function castSkill(n){if(!started||ended||!player.alive)return;if(n===1&&skill1<=0&&mana>=25){skill1=5;mana-=25;const e=closestEnemy(player,8);if(e)damage(e,player.atk*2.5);for(const v of [...heroes,...minions])if(v.team==='red'&&v.alive&&v.g.position.distanceTo(player.g.position)<4)damage(v,player.atk*1.2)}if(n===2&&skill2<=0&&mana>=20){skill2=7;mana-=20;const dir=new THREE.Vector3(joy.x,0,joy.y);if(dir.length()<.2)dir.set(1,0,0);player.g.position.add(dir.normalize().multiplyScalar(6));player.g.position.x=THREE.MathUtils.clamp(player.g.position.x,-32,32);player.g.position.z=THREE.MathUtils.clamp(player.g.position.z,-22,22)}}
function setEnd(win){ended=true;$('#end').classList.remove('hidden');$('#result').textContent=win?'胜利！':'失败';$('#endText').textContent='击败 '+kills+' 名敌方英雄 · 战斗 '+Math.floor(elapsed)+' 秒'}
function towerUpdate(dt){for(const t of towers){if(t.hp<=0)continue;t.cool-=dt;if(t.cool<=0){let target=[...heroes,...minions].filter(h=>h.team!==t.team&&h.alive&&h.g.position.distanceTo(t.group.position)<t.range).sort((a,b)=>a.g.position.distanceTo(t.group.position)-b.g.position.distanceTo(t.group.position))[0];if(target){t.cool=1.2;damage(target,90)}}}}
function unitAI(u,dt){if(!u.alive)return;u.cool=Math.max(0,u.cool-dt);const enemy=closestEnemy(u,u.range+1);if(enemy){if(u.cool<=0)attack(u);if(!u.isPlayer&&!u.isMinion){const d=u.g.position.distanceTo(enemy.g.position);if(d>u.range*.8){const v=enemy.g.position.clone().sub(u.g.position).setY(0).normalize();u.g.position.add(v.multiplyScalar(u.speed*dt*.55))}}}else if(!u.isPlayer){const destX=u.team==='blue'?20:-20;const dx=destX-u.g.position.x;u.g.position.x+=Math.sign(dx)*u.speed*dt*.45;u.g.position.z+=(u.baseZ-u.g.position.z)*dt*.2}}
const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.04);if((started||window.__gameStarted)&&!ended){started=true;$('#intro').style.display='none';elapsed+=dt;skill1=Math.max(0,skill1-dt);skill2=Math.max(0,skill2-dt);mana=Math.min(100,mana+dt*2.5);player.cool=Math.max(0,player.cool-dt);if(player.alive){player.g.position.x+=joy.x*player.speed*dt;player.g.position.z+=joy.y*player.speed*dt;player.g.position.x=THREE.MathUtils.clamp(player.g.position.x,-33,33);player.g.position.z=THREE.MathUtils.clamp(player.g.position.z,-23,23);if(attackHeld)attack(player);if(player.g.position.x>28&&towers.filter(t=>t.team==='red'&&t.hp>0).length===0&&redCrystalHp<=0){setEnd(true)}}for(const h of heroes)if(!h.isPlayer)unitAI(h,dt);for(const m of minions)unitAI(m,dt);towerUpdate(dt);if(Math.floor(elapsed)%18===0&&Math.floor(elapsed)!==loop.lastSpawn){loop.lastSpawn=Math.floor(elapsed);spawnMinions()}if(redBase.position.x<0)setEnd(true);updateHud()}const target=player.g.position;camera.position.lerp(new THREE.Vector3(target.x,target.y+24,target.z+27),.04);camera.lookAt(target.x,0,target.z);blueBase.rotation.y+=dt*.35;redBase.rotation.y-=dt*.35;renderer.render(scene,camera)}loop();
const joyEl=$('#joy'),stick=$('#stick');let joyId=null;function joyMove(e){const r=joyEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy,len=Math.hypot(dx,dy),max=39;if(len>max){dx=dx/len*max;dy=dy/len*max}joy.x=dx/max;joy.y=dy/max;stick.style.left='calc(50% + '+dx+'px)';stick.style.top='calc(50% + '+dy+'px)'}
joyEl.addEventListener('pointerdown',e=>{joyId=e.pointerId;joyEl.setPointerCapture(joyId);joyMove(e)});joyEl.addEventListener('pointermove',e=>{if(e.pointerId===joyId)joyMove(e)});function joyEnd(e){if(e.pointerId===joyId){joyId=null;joy.x=joy.y=0;stick.style.left='50%';stick.style.top='50%'}}joyEl.addEventListener('pointerup',joyEnd);joyEl.addEventListener('pointercancel',joyEnd);
$('#attack').addEventListener('pointerdown',e=>{attackHeld=true;attack(player)});['pointerup','pointercancel','pointerleave'].forEach(ev=>$('#attack').addEventListener(ev,()=>attackHeld=false));$('#skill1').addEventListener('click',()=>castSkill(1));$('#skill2').addEventListener('click',()=>castSkill(2));$('#recall').addEventListener('click',()=>{if(!started||recall>0)return;recall=3;$('#hint').textContent='回城引导中…';setTimeout(()=>{if(started&&!ended){player.g.position.set(-25,0,0);player.hp=player.max;mana=100;$('#hint').textContent='摧毁敌方水晶，守护己方基地'}recall=0},3000)});
function start(e){if(e){e.preventDefault();e.stopPropagation()}if(started)return;started=true;$('#intro').classList.add('hidden');$('#intro').style.display='none';elapsed=0;updateHud()}
const startBtn=$('#start');
['pointerdown','touchstart','click'].forEach(type=>startBtn.addEventListener(type,start,{passive:false}));
startBtn.addEventListener('touchend',start,{passive:false});
startBtn.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){start(e)}});
$('#again').addEventListener('click',()=>location.reload());function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);$('#rotate').style.display=innerHeight>innerWidth?'block':'none'}addEventListener('resize',resize);resize();
</script></body></html>
