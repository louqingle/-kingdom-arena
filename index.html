<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101b2b">
<title>王者战域 · 5V5</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101b2b;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;touch-action:none;color:#fff}#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}#hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:env(safe-area-inset-top,8px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:8px 18px;background:#0a1424c9;border:1px solid #ffffff24;border-radius:0 0 18px 18px;backdrop-filter:blur(12px);font-size:12px;white-space:nowrap}.score{font-size:19px;font-weight:900;color:#ffe08a}.timer{font-variant-numeric:tabular-nums;color:#dceaff}.team{font-weight:800}.blue{color:#63b7ff}.red{color:#ff7979}.hint{position:absolute;top:66px;left:50%;transform:translateX(-50%);font-size:11px;color:#d7e5f8;background:#071323a8;padding:6px 12px;border-radius:20px;white-space:nowrap}.panel{position:absolute;left:12px;top:72px;background:#091729b8;border:1px solid #ffffff22;border-radius:12px;padding:8px 10px;font-size:10px;line-height:1.7;color:#cbd9ec}.panel b{color:#fff}.bottom{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));left:0;right:0;height:145px}.joystick{position:absolute;left:20px;bottom:4px;width:112px;height:112px;border-radius:50%;background:#b6d7ff20;border:2px solid #d6e9ff55;pointer-events:auto;touch-action:none;box-shadow:inset 0 0 24px #9bcaff18}.stick{position:absolute;left:50%;top:50%;width:46px;height:46px;transform:translate(-50%,-50%);border-radius:50%;background:linear-gradient(145deg,#e9f6ff,#6fa8dc);box-shadow:0 4px 18px #0008}.actions{position:absolute;right:18px;bottom:0;display:flex;align-items:flex-end;gap:10px;pointer-events:auto}.act{width:58px;height:58px;border-radius:50%;border:2px solid #ffffff9c;background:linear-gradient(145deg,#284d75,#10263f);color:white;font-size:11px;font-weight:800;box-shadow:0 5px 15px #0008;touch-action: manipulation}.act.big{width:72px;height:72px;background:linear-gradient(145deg,#f2b85b,#9b4d22);font-size:13px}.act:active{transform:scale(.94);filter:brightness(1.3)}.act small{display:block;font-size:9px;font-weight:500;opacity:.8}.bars{position:absolute;left:50%;bottom:156px;transform:translateX(-50%);width:180px;text-align:center;font-size:10px;text-shadow:0 1px 3px #000}.bar{height:6px;border-radius:8px;background:#28394d;margin:3px 0 5px;overflow:hidden}.hp{height:100%;width:100%;background:linear-gradient(90deg,#4ee28a,#a4f36a)}.mp{height:100%;width:100%;background:#53baff}.overlay{position:absolute;inset:0;z-index:20;background:#071323d9;display:flex;align-items:center;justify-content:center;pointer-events:auto;padding:24px}.card{width:min(420px,100%);background:linear-gradient(150deg,#1b3452,#0b1728);border:1px solid #ffffff2b;border-radius:24px;padding:26px;box-shadow:0 20px 70px #0009;text-align:center}.logo{font-size:12px;letter-spacing:5px;color:#8bbbe8}.card h1{font-size:32px;margin:8px 0}.card p{font-size:13px;line-height:1.8;color:#c3d4e8}.start{position:relative;z-index:100;display:inline-block;min-width:190px;min-height:56px;cursor:pointer;user-select:none;-webkit-user-select:none;z-index:30;pointer-events:auto;touch-action:manipulation;-webkit-appearance:none;appearance:none;border:0;border-radius:14px;padding:14px 34px;background:linear-gradient(90deg,#f5c66e,#e78d45);font-weight:900;font-size:16px;color:#172033;margin-top:12px}.tip{font-size:10px!important;color:#8fa7c2!important}.result{font-size:26px;font-weight:900;margin:12px}.hidden{display:none!important}@media(orientation:portrait){.rotate{display:block!important}}.rotate{display:none;position:absolute;inset:0;background:#081525eF;z-index:10;text-align:center;padding-top:40vh;font-size:18px;font-weight:800}
</style>
</head>
<body><div id="game"></div><div id="hud">
<div class="top"><span class="team blue">蓝方</span><span class="score" id="score">0 : 0</span><span class="team red">红方</span><span class="timer" id="timer">00:00</span></div>
<div class="hint" id="hint">摧毁敌方水晶，守护己方基地</div>
<div class="panel"><b>王者战域 · 训练赛</b><br>击败：<span id="kills">0</span>　金币：<span id="gold">300</span><br>目标：摧毁红方水晶</div>
<div class="bars"><span id="heroName">破阵战士 · Lv.1</span><div class="bar"><div class="hp" id="hp"></div></div><div class="bar"><div class="mp" id="mana"></div></div></div>
<div class="bottom"><div class="joystick" id="joy"><div class="stick" id="stick"></div></div><div class="actions"><button class="act" id="skill2">位移<small>技能2</small></button><button class="act" id="skill1">旋风<small>技能1</small></button><button class="act" id="recall">回城<small>3秒</small></button><button class="act big" id="attack">普攻<small>自动锁敌</small></button></div></div>
<div class="overlay" id="intro"><div class="card"><div class="logo">KINGDOM ARENA</div><h1>王者战域</h1><p>5V5 单人对战 · 3D 斜俯视<br>操控蓝方战士，和队友一起推进三路，击破敌方防御塔与水晶。</p><p class="tip">建议横屏游玩 · 左侧摇杆移动 · 右侧按钮攻击和释放技能</p><button type="button" class="start" id="start" onclick="window.__gameStarted=true;document.getElementById('intro').style.display='none';" ontouchend="window.__gameStarted=true;document.getElementById('intro').style.display='none';">进入战场</button></div></div>
<div class="overlay hidden" id="end"><div class="card"><div class="logo">MATCH OVER</div><div class="result" id="result">胜利</div><p id="endText">战斗结束</p><button class="start" id="again">再来一局</button></div></div>
<div class="rotate" id="rotate">请将手机横过来<br><small>横屏体验更佳</small></div>
</div>
<script>
(function(){
 function enter(e){
  if(e){e.preventDefault();e.stopPropagation();}
  window.__gameStarted=true;
  var intro=document.getElementById('intro');
  if(intro){intro.hidden=true;intro.style.display='none';intro.style.pointerEvents='none';}
  var hint=document.getElementById('hint');
  if(hint)hint.textContent='正在进入战场…';
 }
 document.addEventListener('click',function(e){if(e.target&&e.target.closest&&e.target.closest('#start'))enter(e)},true);
 document.addEventListener('touchend',function(e){if(e.target&&e.target.closest&&e.target.closest('#start'))enter(e)},true);
 document.addEventListener('pointerup',function(e){if(e.target&&e.target.closest&&e.target.closest('#start'))enter(e)},true);
 window.addEventListener('error',function(){var h=document.getElementById('hint');if(h)h.textContent='游戏加载出错，请刷新页面';});
 window.addEventListener('unhandledrejection',function(){var h=document.getElementById('hint');if(h)h.textContent='3D引擎加载失败，请检查网络后刷新';});
})();
</script>
<script>
(()=>{
const root=document.getElementById('game');
const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');
canvas.style.cssText='position:absolute;inset:0;width:100%;height:100%;display:block';
root.appendChild(canvas);
let W=0,H=0,dpr=1,started=false,elapsed=0,kills=0,gold=300,mana=100,attackHeld=false;
const $=s=>document.querySelector(s);
const player={x:-23,z:1,team:0,hp:1400,max:1400,speed:7,cd:0,alive:true};
const units=[player];
for(let i=0;i<4;i++){units.push({x:-25,z:[-12,-4,5,13][i],team:0,hp:850,max:850,speed:3.2,cd:0,role:['盾','法','射','刺'][i]});units.push({x:24,z:[-13,-5,4,12][i],team:1,hp:850,max:850,speed:3.2,cd:0,role:['盾','法','射','刺'][i]})}
units.push({x:24,z:0,team:1,hp:850,max:850,speed:3.2,cd:0,role:'战'});
const minions=[];
function wave(){for(let t=0;t<2;t++)for(const z of [-16,0,16])minions.push({x:t?28:-28,z,team:t,hp:220,max:220,speed:2.1,cd:0,minion:true})}
wave();
const towers=[];for(const z of [-18,0,18]){towers.push({x:-19,z,team:0,hp:1000,max:1000},{x:19,z,team:1,hp:1000,max:1000})}
let crystal=2400,skillA=0,skillB=0,recall=0,joy={x:0,y:0},lastWave=0;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
function project(x,z,y=0){const scale=Math.min(W/76,H/48)*1.05;return {x:W*.5+(x-player.x)*scale*.88+(z-player.z)*scale*.48,y:H*.49+(z-player.z)*scale*.30-(x-player.x)*scale*.18-y*scale*.72}}
function poly(points,color){ctx.fillStyle=color;ctx.beginPath();points.forEach((p,i)=>{const q=project(p[0],p[1]);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)});ctx.closePath();ctx.fill()}
function line(points,color,width){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.beginPath();points.forEach((p,i)=>{const q=project(p[0],p[1]);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)});ctx.stroke()}
function ellipse(x,z,rx,ry,color){const p=project(x,z);ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(p.x,p.y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function drawUnit(u){if(!u.alive)return;const p=project(u.x,u.z);const blue=u.team===0;const s=Math.max(5,Math.min(12,W/70));ellipse(u.x,u.z,s*1.15,s*.48,'#17251d99');ctx.fillStyle=blue?'#258be8':'#e34d59';ctx.beginPath();ctx.arc(p.x,p.y-s*.9,s*.72,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f0c69e';ctx.beginPath();ctx.arc(p.x,p.y-s*2.0,s*.46,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f5ce70';ctx.beginPath();ctx.moveTo(p.x-s*.48,p.y-s*2.25);ctx.lineTo(p.x,p.y-s*3.1);ctx.lineTo(p.x+s*.48,p.y-s*2.25);ctx.closePath();ctx.fill();ctx.fillStyle='#101923';ctx.fillRect(p.x-s,p.y-s*3.5,s*2,3);ctx.fillStyle='#55e58a';ctx.fillRect(p.x-s,p.y-s*3.5,s*2*Math.max(0,u.hp/u.max),3);if(u===player){ctx.strokeStyle='#ffe08a';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(p.x,p.y, s*1.5,s*.65,0,0,Math.PI*2);ctx.stroke()}}
function drawTower(t){const p=project(t.x,t.z);ctx.fillStyle=t.team?'#a93340':'#2368a8';ctx.beginPath();ctx.arc(p.x,p.y-12,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d8bd82';ctx.fillRect(p.x-5,p.y-29,10,18);ctx.fillStyle='#ffe29a';ctx.beginPath();ctx.moveTo(p.x-8,p.y-28);ctx.lineTo(p.x,p.y-42);ctx.lineTo(p.x+8,p.y-28);ctx.fill();ctx.fillStyle='#16202a';ctx.fillRect(p.x-12,p.y-48,24,3);ctx.fillStyle='#59e18b';ctx.fillRect(p.x-12,p.y-48,24*t.hp/t.max,3)}
function drawCrystal(x,z,color){const p=project(x,z);ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(p.x,p.y-45);ctx.lineTo(p.x+14,p.y-24);ctx.lineTo(p.x,p.y-5);ctx.lineTo(p.x-14,p.y-24);ctx.closePath();ctx.fill();ctx.strokeStyle='#fff3c4';ctx.lineWidth=2;ctx.stroke();ellipse(x,z,24,8,'#e8c66a66')}
function render(){ctx.clearRect(0,0,W,H);const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#8eb2c6');bg.addColorStop(.5,'#668d69');bg.addColorStop(1,'#294b3d');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
poly([[-36,-25],[36,-25],[36,25],[-36,25]],'#557d55');
for(const z of [-16,0,16]){line([[-34,z],[-20,z],[-8,z],[0,z],[12,z],[22,z],[34,z]],'#b7a37b',Math.max(12,W*.017));line([[-34,z],[-20,z],[-8,z],[0,z],[12,z],[22,z],[34,z]],'#d9c89e',2)}
for(let i=0;i<48;i++){const x=((i*17)%67)-33,z=((i*29)%47)-23;if(Math.abs(z)<3||Math.abs(Math.abs(z)-16)<2||Math.abs(x)<5)continue;ellipse(x,z,4,2,'#254f3c');const p=project(x,z);ctx.fillStyle='#315e42';ctx.beginPath();ctx.arc(p.x,p.y-9,7,0,Math.PI*2);ctx.fill()}
drawCrystal(-31,0,'#56baff');drawCrystal(31,0,'#ff6570');towers.forEach(drawTower);
[...minions,...units].sort((a,b)=>a.x+a.z-b.x-b.z).forEach(drawUnit);
if(started){const p=project(player.x,player.z);ctx.fillStyle='#ffffffcc';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText('你',p.x,p.y-40)}
}
function nearestEnemy(u,r){let best=null,dist=r;for(const e of [...units,...minions])if(e!==u&&e.team!==u.team&&e.alive!==false&&e.hp>0){const d=Math.hypot(e.x-u.x,e.z-u.z);if(d<dist){dist=d;best=e}}return best}
function hurt(e,n){if(!e||e.hp<=0)return;e.hp-=n;if(e.hp<=0){e.alive=false;if(e.team===1){gold+=e.minion?35:100;if(!e.minion)kills++}if(e===player){setTimeout(()=>{player.hp=player.max;player.x=-24;player.z=0;player.alive=true},3000)}}}
function strike(u){if(u.cd>0||u.hp<=0)return;const e=nearestEnemy(u,u===player?6:4);u.cd=u===player?.5:1.1;if(e){hurt(e,u===player?115:55);return}if(u===player){const t=towers.filter(v=>v.team===1&&v.hp>0).sort((a,b)=>Math.hypot(a.x-u.x,a.z-u.z)-Math.hypot(b.x-u.x,b.z-u.z))[0];if(t&&Math.hypot(t.x-u.x,t.z-u.z)<7)t.hp=Math.max(0,t.hp-115);else if(!t&&Math.hypot(31-u.x,u.z)<7)crystal=Math.max(0,crystal-115)}}
function skill(n){if(!started||mana<20)return;if(n===1&&skillA<=0){skillA=5;mana-=25;for(const e of [...units,...minions])if(e.team===1&&Math.hypot(e.x-player.x,e.z-player.z)<6)hurt(e,240)}if(n===2&&skillB<=0){skillB=7;mana-=20;let dx=joy.x, dz=joy.y;if(Math.hypot(dx,dz)<.1)dx=1;player.x=Math.max(-33,Math.min(33,player.x+dx/Math.hypot(dx,dz)*6));player.z=Math.max(-23,Math.min(23,player.z+dz/Math.hypot(dx,dz)*6))}}
function update(dt){if(!started)return;elapsed+=dt;mana=Math.min(100,mana+dt*2);skillA=Math.max(0,skillA-dt);skillB=Math.max(0,skillB-dt);player.x=Math.max(-33,Math.min(33,player.x+joy.x*player.speed*dt));player.z=Math.max(-23,Math.min(23,player.z+joy.y*player.speed*dt));for(const u of [...units,...minions]){if(u===player||u.hp<=0)continue;u.cd=Math.max(0,u.cd-dt);const e=nearestEnemy(u,5);if(e){if(u.cd<=0)strike(u);const d=Math.hypot(e.x-u.x,e.z-u.z);if(d>2){u.x+=(e.x-u.x)/d*u.speed*dt*.35;u.z+=(e.z-u.z)/d*u.speed*dt*.35}}else{u.x+=(u.team===0?1:-1)*u.speed*dt*.35}}
if(attackHeld)strike(player);for(const t of towers)if(t.hp>0){t.cool=(t.cool||0)-dt;if(t.cool<=0){const target=[...units,...minions].filter(u=>u.team!==t.team&&u.hp>0&&Math.hypot(u.x-t.x,u.z-t.z)<8).sort((a,b)=>Math.hypot(a.x-t.x,a.z-t.z)-Math.hypot(b.x-t.x,b.z-t.z))[0];if(target){hurt(target,80);t.cool=1.3}}}
if(elapsed-lastWave>18){lastWave=elapsed;wave()}if(crystal<=0)endGame(true);if(player.hp<=0){}$('#hp').style.width=Math.max(0,player.hp/player.max*100)+'%';$('#mana').style.width=mana+'%';$('#kills').textContent=kills;$('#gold').textContent=gold;$('#timer').textContent=String(Math.floor(elapsed/60)).padStart(2,'0')+':'+String(Math.floor(elapsed%60)).padStart(2,'0')}
let ended=false;function endGame(win){if(ended)return;ended=true;$('#end').classList.remove('hidden');$('#result').textContent=win?'胜利！':'失败';$('#endText').textContent='击败 '+kills+' 名敌方单位 · 战斗 '+Math.floor(elapsed)+' 秒'}
function start(){if(started)return;started=true;$('#intro').classList.add('hidden');$('#intro').style.display='none';$('#hint').textContent='摧毁红方水晶，左侧摇杆移动';}
const startBtn=$('#start');['click','touchend','pointerup'].forEach(ev=>startBtn.addEventListener(ev,e=>{e.preventDefault();start()},{passive:false}));
$('#again').addEventListener('click',()=>location.reload());
const joyEl=$('#joy'),stick=$('#stick');let joyId=null;
function moveJoy(e){const r=joyEl.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),len=Math.hypot(dx,dy),m=39;if(len>m){dx*=m/len;dy*=m/len}joy.x=dx/m;joy.y=dy/m;stick.style.left='calc(50% + '+dx+'px)';stick.style.top='calc(50% + '+dy+'px)'}
joyEl.addEventListener('pointerdown',e=>{joyId=e.pointerId;joyEl.setPointerCapture(joyId);moveJoy(e)});joyEl.addEventListener('pointermove',e=>{if(e.pointerId===joyId)moveJoy(e)});function joyEnd(e){if(e.pointerId===joyId){joyId=null;joy.x=joy.y=0;stick.style.left='50%';stick.style.top='50%'}}joyEl.addEventListener('pointerup',joyEnd);joyEl.addEventListener('pointercancel',joyEnd);
$('#attack').addEventListener('pointerdown',e=>{attackHeld=true;strike(player)});['pointerup','pointercancel','pointerleave'].forEach(ev=>$('#attack').addEventListener(ev,()=>attackHeld=false));$('#skill1').addEventListener('click',()=>skill(1));$('#skill2').addEventListener('click',()=>skill(2));$('#recall').addEventListener('click',()=>{if(started&&!recall){recall=1;$('#hint').textContent='回城中…';setTimeout(()=>{player.x=-25;player.z=0;player.hp=player.max;mana=100;recall=0;$('#hint').textContent='摧毁红方水晶'},1800)}});
let previous=performance.now();function frame(now){const dt=Math.min(.04,(now-previous)/1000);previous=now;update(dt);render();requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script></body></html>
